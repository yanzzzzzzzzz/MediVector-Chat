name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python ${{ matrix.python }} / PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: medivector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medivector_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_HOST: 127.0.0.1
      PG_PORT: '5432'
      PG_USER: postgres
      PG_PASSWORD: test-only-password
      PG_DATABASE: medivector_test
      RUN_DB_TESTS: '1'
      API_USERS: '{}'
      OPENAI_API_KEY: ''
      TIKTOKEN_CACHE_DIR: /tmp/medivector-tiktoken-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            evaluation/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r evaluation/requirements.txt
      - name: Prepare tokenizer data (tests make no OpenAI API calls)
        run: python -c 'import tiktoken; tiktoken.get_encoding("cl100k_base")'
      - name: Unit and real PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
      - name: Report human acceptance prerequisites (not a release gate)
        run: |
          set +e
          python -m evaluation.acceptance_readiness "$RUNNER_TEMP/acceptance-readiness.json"
          readiness_status=$?
          set -e
          test "$readiness_status" -eq 2
          cat "$RUNNER_TEMP/acceptance-readiness.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Synthetic rule reports and release gate regression
        run: |
          python -m evaluation.medical_rules evaluation/medical_rules_cases.json "$RUNNER_TEMP/medical-rules.json"
          if python -m evaluation.release_gate "$RUNNER_TEMP/medical-rules.json" "$RUNNER_TEMP/release-gate.json"; then
            exit 1
          else
            test "$?" -eq 2
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Synthetic negative quality-gate regression\n\nExpected: Fail blocks release. This is not the clinical release baseline.\n\n')
              for stem in ('medical-rules', 'release-gate'):
                  summary.write((directory / (stem + '.md')).read_text())
                  summary.write('\n<details><summary>JSON report: ' + stem + '</summary>\n\n```json\n')
                  summary.write((directory / (stem + '.json')).read_text())
                  summary.write('\n```\n</details>\n')
          PY

  frontend:
    name: Frontend tests, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/medivector-chat-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '10'
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm run lint
      - run: pnpm run build
